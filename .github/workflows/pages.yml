name: pages

# Deploys the GitHub Pages site from README.md: the repository's front door is
# the site's front page, rendered by GitHub's own Markdown renderer so the two
# read identically. The fit figures README references and the dated reports
# under cities/<city>/docs/reports/ are carried along. Nothing is typed into the site that is
# not in the repository; see .github/scripts/build_pages.py.
#
# The repository's Pages source must be "GitHub Actions" (build_type: workflow)
# for this deployment to be the live one.

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "cities/*/docs/reports/**"
      - "cities/*/docs/reference/figures/**"
      - ".github/scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Render README.md and assemble the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_SOURCE_BRANCH: ${{ github.ref_name }}
        run: python .github/scripts/build_pages.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
